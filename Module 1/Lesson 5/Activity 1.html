<!DOCTYPE html>
<html>
    <Head>
        <title>
            Application Form!
        </title>
    </Head>
    <body>
        <form>
            <fieldset>
                <legend>
                    Personal Details!
                </legend>
                <label>
                    First Name:
                </label>
                <input type="text" id="fname" placeholder="Enter Your First Name">
                <br> <br>
                <label>
                    Last Name:
                </label>
                <input type="text" id="lname" placeholder="Enter your last name here">
                <br> <br>
                <label>
                    Birth Date:
                </label>
                <input type="date" id="dod">
            </fieldset>
            <fieldset>
                <legend>
                    Select Your Doctor
                </legend>
                <label>Doctor Name</label>
                <select id="doctorid">
                    <option value="null">--Select a Doctor--</option>
                    <option value="Dr. Alex">Dr. Alex is ENT Specialist</option>
                    <option value="Dr. John">Dr. John is General Physician</option>
                    <option value="Dr. Hatim">Dr. Hatim is a Surgeon</option>
                </select>
            </fieldset>
        </form>
    </body>
</html>
