<!DOCTYPE html>
<html>
<head>
    <title>My Cartoon Card</title>
    
    
    <style>
        * {
            font-family: Arial;
        }

        
        body {
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: purple;
        }

        p {
            font-size: 16px;
        }

        
        #cartoon-card {
            background-color: white;
            padding: 20px;
            border: 2px solid black;
        }

        
        .cartoon-detail {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    
    <h1>Favorite Cartoon Character</h1>
    
    
    <p style="color: red; font-size: 18px;">This is a page about my absolute favorite cartoon character.</p>

    
    <div id="cartoon-card">
        <h2>SpongeBob SquarePants</h2>
        
        
        <p class="cartoon-detail">Species: Sea Sponge</p>
        <p class="cartoon-detail">Home: Bikini Bottom</p>
        
        <h3>Why I like him:</h3>
        <p>He is always happy and makes funny faces.</p>
    </div>

</body>
</html>
