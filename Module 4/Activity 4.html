<html>
    <head>
        <title>
            Working with variables!
        </title>
    </head>
    <body>

        <p id="product"></p>
           <p id="sum"></p>
              <p id="difference"></p>

        <script>
           var num1,num2,product,sum,difference;
           num1=12;
           num2=11;
           product=num1*num2;
           sum=num1+num2;
           difference=num1-num2;
           document.getElementById("product").innerHTML = "the product of 2 number is " + product;
           document.getElementById("sum").innerHTML = "the sum of 2 number is " + sum;
             document.getElementById("difference").innerHTML = "the difference of 2 number is " + difference;

        </script>
    </body>
</html>
