<!DOCTYPE html>
<html>
    <head>
        <title>
            My Zoo
        </title>
        <style>
            body 
            {
                background: aliceblue;
                text-align:center;
                padding:30px;
            }
            #zoo
            {
                border: 2px solid darkblue;
                width: 300px;
                margin:16px;
                padding: 12px;
                border-radius: 20px;
                background:white;
                
            }
            .zone
            {
                border: 2px solid green;
                margin: 6px;
                padding:8px;
                border-radius: 6px;
                text-align:left;

            }
            button 
            {
                background:white;
                color:red;
                padding:10px;
                border:none;
                border-radius: 20px;
                cursor:pointer;
            }
        </style>
    </head>
    <body>
        <h1> Welcome to My Zoo </h1>
        <p> We are going to use JS to add animals to different cages!</p>
        <div id="zoo">
            <div class="zone">Zone 1:<span id="zone1"></span></div>
                        <div class="zone">Zone 2:<span id="zone2"></span></div>
                                    <div class="zone">Zone 3:<span id="zone3"></span></div>
                                                <div class="zone">Total Animals:<span id="total"></span></div>
        </div>
        <br>
        <br><br><br>
        <button onclick="openzoo()">Open Zoo</button>
        <p id="status"></p>
        <script>
            function openzoo()
            {
                document.getElementById("zone1").innerHTML = "Lion";
                document.getElementById("zone2").innerHTML = "Elephant";
                document.getElementById("zone3").innerHTML = "Giraffe";
                document.getElementById("total").innerHTML = "3";
                document.getElementById("zoo").style.backgroundColor = "lightgreen";
                document.getElementById("status").innerHTML = document.title + " is now open!";
            }
        </script>
    </body>
</html>
