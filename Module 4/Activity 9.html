<!DOCTYPE html>
<html>
    <head>
        <title>
           Print Fruit Lists
        </title>
    </head>
    <body>
<h1>Printing Fruit Lists</h1>
<script>
    var fruits= ["apple", "banana", "mango", "grapes", "kiwi"];
  let output="";
    for (let i=0; i<fruits.length; i++) 
        {
            output += fruits[i] + "<br>";
        }
        document.write(output);
</script>
    </body>
    </html>
