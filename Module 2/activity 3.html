<!DOCTYPE html>
<html>
    <head>
        <title>
            Superhero Card!
        </title>
        <style>
            body {
                background-color: blue;
                font-family: arial;
                color: white;

            }
            .Hero-Name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 4px orange;


            }
            .Tagline {
                text-transform: capitalize;
                font-style: italic;

            }
            .label {
                text-transform: uppercase;
                text-decoration: underline;
            }
            .superpower {
                color: coral;
                font-weight: bold;
            }
            .weakness
            {
                color: gray;
                text-decoration: line-through;
            }
            .badge {
                font-size: 30px;
                font-weight: bold;
                transform: rotate(-7deg);
                color: rgb(159, 211, 16);
            }
        </style>
    </head>
    <body>
        <h1 class="Hero-Name">Thunder Kid</h1>
        <p class="Tagline">Thunder Kid the strongest superhero in the world!</p>
        <h2 class="label">Superpowers</h2>
        <p class="superpower">Can lift a school!</p>
        <p class="superpower"> Can run at the speed of sound!</p>
        <p class="superpower"> Can shoot lightning from his hands!</p>
        <h2 class="label">Weaknesses</h2>
        <p class="weakness"> Doesn't like math homework!</p>
        <p class="weakness"> Can't do work too long without breaks!</p>
        <p class="badge">The Strongest Hero in the World</p>
    </body>
</html>
