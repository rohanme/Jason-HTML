<!DOCTYPE html>
<html>
    <head>
        <title>
            My Resturant Food Menu
        </title>
        <style>
            body
            {
                font-family: 'Times New Roman';
                background-color: cyan;
                color: darkblue;
            }
            h1
            {
                color: green;

            }
            p
            {
                font-weight: bold;
            }
            h1 + p 
            {
                background-color: yellow;
            }
            ol>li
            {
                color:red;
                font-weight: bold;
            }
            ol li:nth-child(3)
            {
                background:pink;
            }
            .description
            {
                color: black;
                font-size: 20px;
            }
            .description::first-letter{
                color:Blue;
                font-size: 40px;
            }
            h1:hover{
                color: red;
            }

        </style>
    </head>
    <body>
        <h1>
        Home Cooking
        </h1>
        <p>
            Welcome to our restaurant! We serve the best home-cooked meals in town.
        </p>
        <ol>
            <li>
                Pizza
            </li>
            <li>
                Pasta
            </li>
            <li>
                Salad
            </li>
            <li>
                Chicken Curry
            </li>

        </ol>
        <p class="description">
            We have been FSSI certified since 1998 and serve the best quality home food in town.
        </p>
    </body>
</html>
